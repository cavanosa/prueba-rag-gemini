spring.application.name=prueba-rag-gemini

# Autenticación por API key (Gemini Developer API, no Vertex AI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Chat
spring.ai.openai.chat.options.model=gemini-1.5-flash

# Embeddings ? api-key propia y modelo actual
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001