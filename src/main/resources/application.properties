spring.application.name=prueba-rag-gemini

# Autenticación por API key (Gemini Developer API, no Vertex AI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Chat
spring.ai.openai.chat.options.model=gemini-1.5-flash

# Embeddings ? api-key propia y modelo actual
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# ===================================================================
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=raguser
spring.datasource.password=ragpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=NONE